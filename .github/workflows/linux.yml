name: Linux app — Build, test and publish
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publish a release or run build, tests and compatibility checks only'
        required: true
        default: publish
        type: choice
        options: [publish, check]
      increment:
        description: 'Build, test, and publish the latest main with this version increment'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
permissions:
  contents: read
concurrency:
  group: linux-beta-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Require main for publication
        if: inputs.mode == 'publish' && github.ref != 'refs/heads/main'
        run: echo '::error::Select main to publish; check-only runs may use another branch.' && exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mode == 'publish' && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publishing configuration
        if: inputs.mode == 'publish'
        env:
          APT_SIGNING_KEY: ${{ secrets.LINUX_APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.LINUX_APT_SIGNING_FINGERPRINT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in APT_SIGNING_KEY APT_SIGNING_FINGERPRINT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Linux publishing configuration: $name"
              exit 1
            fi
          done
      - name: Select next version from the published Linux archive
        id: version
        env:
          RELEASE_INCREMENT: ${{ inputs.increment }}
        run: node scripts/release-version.mjs select linux "$RELEASE_INCREMENT"
      - name: Pin the selected source for all jobs
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Source commit selected for this run: **$sha**. Publication follows successful build and compatibility checks." >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: version
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential cmake python3 libarchive13 \
            qt6-base-dev qt6-qpa-plugins qt6-wayland libgl1-mesa-dev \
            libfontconfig1 libxcb-present0 fonts-dejavu-core dpkg-dev gnupg binutils
          # Minimal containers can have an empty machine-id; Qt's D-Bus
          # integration requires one even for offscreen renderer checks.
          python3 -c 'from pathlib import Path; import uuid; p = Path("/etc/machine-id"); p.write_text(uuid.uuid4().hex + "\n") if not p.exists() or not p.read_text().strip() else None'
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test development interactions
        run: |
          python3 linux/packaging/acquire-renderer.py
          cmake -S linux -B build/linux-ci -DCMAKE_BUILD_TYPE=Release -DCALLAYERS_DEVELOPMENT=ON ${VERSION:+"-DCALLAYERS_RELEASE_VERSION=$VERSION"}
          cmake --build build/linux-ci --parallel 2
          ctest --test-dir build/linux-ci --output-on-failure
      - name: Build and check production package
        run: |
          bash linux/packaging/build-deb.sh ${VERSION:+"$VERSION"}
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/linux/CMakeCache.txt)
          package="build/linux/callayers_${version}_amd64.deb"
          python3 linux/packaging/check-package.py "$package"
          mkdir -p build/linux-artifact
          cp "$package" linux/packaging/install.sh build/linux-artifact/
          cd build/linux-artifact
          sha256sum callayers_*_amd64.deb install.sh > SHA256SUMS
      - name: Test repository signatures and publication ordering
        run: |
          python3 tests/linux-repository-test.py
          python3 tests/linux-installer-test.py
          python3 tests/linux-installer-actions-test.py
          python3 tests/linux-camera-hook-test.py
          node --test tests/linux-release-test.mjs tests/release-retention-test.mjs tests/release-version-test.mjs tests/linux-website-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: callayers-ubuntu-lts-amd64
          path: build/linux-artifact/
          if-no-files-found: error
          retention-days: 30
  native:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Install native packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zstd
      - uses: actions/download-artifact@v4
        with:
          name: callayers-ubuntu-lts-amd64
          path: build/linux-artifact
      - name: Wrap the exact tested baseline payload in native packages
        run: |
          set -euo pipefail
          (cd build/linux-artifact && sha256sum --check SHA256SUMS)
          packages=(build/linux-artifact/callayers_*_amd64.deb)
          test "${#packages[@]}" -eq 1
          python3 linux/packaging/build-native.py "${packages[0]}" build/linux-native --format rpm
          python3 linux/packaging/build-native.py "${packages[0]}" build/linux-native --format arch
          cd build/linux-native
          sha256sum callayers-*.rpm callayers-*.pkg.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: callayers-native-amd64
          path: build/linux-native/
          if-no-files-found: error
          retention-days: 30
  native-compatibility:
    needs: [version, native]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:43
            pattern: '*.rpm'
          - image: fedora:44
            pattern: '*.rpm'
          - image: archlinux:base
            pattern: '*.pkg.tar.zst'
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: callayers-native-amd64
          path: build/linux-native
      - name: Check native dependency resolution and production renderer
        env:
          PACKAGE_PATTERN: ${{ matrix.pattern }}
        run: |
          set -euo pipefail
          (cd build/linux-native && sha256sum --check SHA256SUMS)
          if command -v python3 >/dev/null; then
            python3 -c 'from pathlib import Path; import uuid; p=Path("/etc/machine-id"); p.write_text(uuid.uuid4().hex+"\n") if not p.exists() or not p.read_text().strip() else None'
          else
            cat /proc/sys/kernel/random/uuid | tr -d '-' > /etc/machine-id
          fi
          packages=(build/linux-native/$PACKAGE_PATTERN)
          test "${#packages[@]}" -eq 1
          bash linux/packaging/check-native-dependencies.sh "${packages[0]}"
  compatibility:
    needs: [version, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install validation tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates python3 binutils
          python3 -c 'from pathlib import Path; import uuid; p = Path("/etc/machine-id"); p.write_text(uuid.uuid4().hex + "\n") if not p.exists() or not p.read_text().strip() else None'
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: callayers-ubuntu-lts-amd64
          path: build/linux-artifact
      - name: Check exact baseline package on newer libraries
        run: |
          set -euo pipefail
          cd build/linux-artifact
          sha256sum --check SHA256SUMS
          packages=(callayers_*_amd64.deb)
          test "${#packages[@]}" -eq 1
          # Resolve the entire package, but do not run the camera post-install
          # script: hosted containers cannot validate a host kernel module.
          apt-get --simulate install "./${packages[0]}"
          depends=$(dpkg-deb -f "${packages[0]}" Depends)
          runtime_depends=${depends/, v4l2loopback-dkms/}
          DEBIAN_FRONTEND=noninteractive apt-get satisfy -y --no-install-recommends "$runtime_depends"
          python3 ../../linux/packaging/check-package.py "${packages[0]}"
  sign:
    if: inputs.mode == 'publish'
    needs: [version, build, native, native-compatibility, compatibility]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: callayers-ubuntu-lts-amd64
          path: build/linux-artifact
      - uses: actions/download-artifact@v4
        with:
          name: callayers-native-amd64
          path: build/linux-native
      - name: Install repository signing tools
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c pacman-package-manager makepkg libarchive-tools
      - name: Check Arch repository tools before importing the signing key
        run: |
          packages=(build/linux-native/callayers-*-1-x86_64.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          python3 tests/linux-native-repository-tools-test.py "${packages[0]}"
      - name: Verify the built version and prepare signed repositories
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
          APT_SIGNING_KEY: ${{ secrets.LINUX_APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.LINUX_APT_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          (cd build/linux-artifact && sha256sum --check SHA256SUMS)
          (cd build/linux-native && sha256sum --check SHA256SUMS)
          cmp build/linux-artifact/install.sh linux/packaging/install.sh
          packages=(build/linux-artifact/callayers_*_amd64.deb)
          test "${#packages[@]}" -eq 1
          version=$(dpkg-deb -f "${packages[0]}" Version)
          test "$version" = "$EXPECTED_VERSION"
          node scripts/release-version.mjs check linux "$version"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          unset APT_SIGNING_KEY
          python3 linux/packaging/build-repository.py "${packages[0]}" build/linux-repository --fingerprint "$APT_SIGNING_FINGERPRINT" --native build/linux-native
          python3 linux/packaging/verify-native-repositories.py build/linux-repository "$version"
      - name: Test signed native publication and tamper rejection without uploading
        env:
          CALLAYERS_TEST_NATIVE_REPOSITORY: build/linux-repository
        run: node --test tests/linux-native-release-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: callayers-linux-signed-repository
          path: build/linux-repository/
          if-no-files-found: error
          retention-days: 30
  repository-clients:
    if: inputs.mode == 'publish'
    needs: [version, sign]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:43', 'fedora:44', 'archlinux:base']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: callayers-linux-signed-repository
          path: build/linux-repository
      - name: Verify native repository signatures with the actual package manager
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash tests/linux-native-clients-test.sh build/linux-repository "$VERSION"
  publish:
    if: inputs.mode == 'publish'
    needs: [version, sign, repository-clients]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install RPM signature verifier
        run: sudo apt-get update && sudo apt-get install -y rpm
      - uses: actions/download-artifact@v4
        with:
          name: callayers-linux-signed-repository
          path: build/linux-repository
      - name: Publish native packages and signed repository metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-linux.mjs build/linux-repository
      - name: Show published Linux version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "Published **Linux $VERSION**. Check https://callayers.com/#download for the current release and install command." >> "$GITHUB_STEP_SUMMARY"
