name: Backend
on:
  pull_request:
    paths: ['backend-v2/**', 'scripts/deploy-backend-v2.ps1', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend-v2/**', 'scripts/deploy-backend-v2.ps1', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-v2/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend-v2
      - run: npm test
        working-directory: backend-v2
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy and check live service
        shell: pwsh
        run: ./scripts/deploy-backend-v2.ps1 -Ci
      - name: Report deployment failure
        if: failure()
        run: echo '::error::Backend deployment/check failed. Review the Actions run and use Cloud Run traffic controls for manual rollback.'
