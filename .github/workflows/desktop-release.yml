name: Windows app — Publish new version
on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Increase the latest published Windows version (current and next versions appear in the run summary)'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
permissions:
  contents: read
concurrency:
  group: desktop-tester-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select next version from the published Windows feed
        id: version
        env:
          RELEASE_INCREMENT: ${{ inputs.increment }}
        run: node scripts/release-version.mjs select windows $env:RELEASE_INCREMENT
      - name: Validate version and build
        shell: pwsh
        run: ./scripts/build.ps1 -ReleaseBuild -Version $env:VERSION -ServiceUrl 'https://callayers-v2-api-3fj7uh2a7a-uc.a.run.app'
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir "build/release-$env:VERSION-x64" -C Release --output-on-failure
          if($LASTEXITCODE -ne 0){throw 'Desktop tests failed.'}
          ./tests/release-update-test.ps1
          node --test tests/release-retention-test.mjs
          if($LASTEXITCODE -ne 0){throw 'Release retention tests failed.'}
          node --test tests/release-version-test.mjs
          if($LASTEXITCODE -ne 0){throw 'Release version tests failed.'}
      - name: Package and authenticate release
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if(-not $env:UPDATE_SIGNING_KEY){throw 'Configure UPDATE_SIGNING_KEY first.'}
          $directory=Join-Path $env:RUNNER_TEMP 'callayers-release-key'
          [IO.Directory]::CreateDirectory($directory)|Out-Null
          $privatePath=Join-Path $directory 'private.json'
          $publicPath=Join-Path $directory 'public.json'
          try {
            [IO.File]::WriteAllText($privatePath,$env:UPDATE_SIGNING_KEY)
            $key=$env:UPDATE_SIGNING_KEY|ConvertFrom-Json
            [IO.File]::WriteAllText($publicPath,(@{Modulus=$key.Modulus;Exponent=$key.Exponent}|ConvertTo-Json -Compress))
            ./scripts/package-desktop.ps1 -Version $env:VERSION -PublicKeyFile $publicPath
            ./scripts/sign-desktop-release.ps1 -Version $env:VERSION -Installer "build/installers/$env:VERSION/CallayersSetup-$env:VERSION.exe" -PrivateKeyFile $privatePath
          } finally {
            if(Test-Path -LiteralPath $privatePath){Remove-Item -LiteralPath $privatePath -Force}
            $env:UPDATE_SIGNING_KEY=''
          }
      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: callayers-${{ steps.version.outputs.version }}-x64
          path: build/installers/${{ steps.version.outputs.version }}/
      - name: Upload installer to R2, then publish update feed
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-desktop.mjs $env:VERSION
