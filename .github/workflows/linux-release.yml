name: Linux app — Publish new version
on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Build, test, and publish the latest main with this version increment'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
permissions:
  contents: read
concurrency:
  group: linux-beta-release
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publishing configuration
        env:
          APT_SIGNING_KEY: ${{ secrets.LINUX_APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.LINUX_APT_SIGNING_FINGERPRINT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in APT_SIGNING_KEY APT_SIGNING_FINGERPRINT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Linux publishing configuration: $name"
              exit 1
            fi
          done
      - name: Select next version from the published Linux archive
        id: version
        env:
          RELEASE_INCREMENT: ${{ inputs.increment }}
        run: node scripts/release-version.mjs select linux "$RELEASE_INCREMENT"
      - name: Pin the latest main commit for all build and publication jobs
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Main commit selected for this release: **$sha**. Publication follows successful build and compatibility checks." >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
      source_sha: ${{ needs.version.outputs.sha }}
  sign:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: callayers-ubuntu-lts-amd64
          path: build/linux-artifact
      - uses: actions/download-artifact@v4
        with:
          name: callayers-native-amd64
          path: build/linux-native
      - name: Install repository signing tools
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c pacman-package-manager makepkg libarchive-tools
      - name: Check Arch repository tools before importing the signing key
        run: |
          packages=(build/linux-native/callayers-*-1-x86_64.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          python3 tests/linux-native-repository-tools-test.py "${packages[0]}"
      - name: Verify the built version and prepare signed repositories
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
          APT_SIGNING_KEY: ${{ secrets.LINUX_APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.LINUX_APT_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          (cd build/linux-artifact && sha256sum --check SHA256SUMS)
          (cd build/linux-native && sha256sum --check SHA256SUMS)
          cmp build/linux-artifact/install.sh linux/packaging/install.sh
          packages=(build/linux-artifact/callayers_*_amd64.deb)
          test "${#packages[@]}" -eq 1
          version=$(dpkg-deb -f "${packages[0]}" Version)
          test "$version" = "$EXPECTED_VERSION"
          node scripts/release-version.mjs check linux "$version"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          unset APT_SIGNING_KEY
          python3 linux/packaging/build-repository.py "${packages[0]}" build/linux-repository --fingerprint "$APT_SIGNING_FINGERPRINT" --native build/linux-native
          python3 linux/packaging/verify-native-repositories.py build/linux-repository "$version"
      - name: Test signed native publication and tamper rejection without uploading
        env:
          CALLAYERS_TEST_NATIVE_REPOSITORY: build/linux-repository
        run: node --test tests/linux-native-release-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: callayers-linux-signed-repository
          path: build/linux-repository/
          if-no-files-found: error
          retention-days: 30
  repository-clients:
    needs: [version, sign]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:43', 'fedora:44', 'archlinux:base']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: callayers-linux-signed-repository
          path: build/linux-repository
      - name: Verify native repository signatures with the actual package manager
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash tests/linux-native-clients-test.sh build/linux-repository "$VERSION"
  publish:
    needs: [version, sign, repository-clients]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install RPM signature verifier
        run: sudo apt-get update && sudo apt-get install -y rpm
      - uses: actions/download-artifact@v4
        with:
          name: callayers-linux-signed-repository
          path: build/linux-repository
      - name: Publish native packages and signed repository metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-linux.mjs build/linux-repository
      - name: Show published Linux version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "Published **Linux $VERSION**. Check https://callayers.com/#download for the current release and install command." >> "$GITHUB_STEP_SUMMARY"
