name: Clean up desktop releases
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview cleanup without deleting installers'
        type: boolean
        default: true
  pull_request:
    paths: ['scripts/release-retention.mjs', 'scripts/cleanup-desktop-releases.mjs', 'tests/release-retention-test.mjs', '.github/workflows/desktop-cleanup.yml']
  push:
    branches: [main]
    paths: ['scripts/release-retention.mjs', 'scripts/cleanup-desktop-releases.mjs', 'tests/release-retention-test.mjs', '.github/workflows/desktop-cleanup.yml']
permissions:
  contents: read
concurrency:
  group: desktop-tester-release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/release-retention-test.mjs
  cleanup:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove retired installers after their grace period
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'No publishing token configured; cleanup skipped.'
            exit 0
          fi
          if [ "$DRY_RUN" = 'true' ]; then
            node scripts/cleanup-desktop-releases.mjs --dry-run
          else
            node scripts/cleanup-desktop-releases.mjs
          fi
