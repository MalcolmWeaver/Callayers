name: Clean up desktop releases
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview cleanup without deleting installers'
        type: boolean
        default: true
  pull_request:
    paths: ['scripts/release-storage.mjs', 'release/download-config.json', 'scripts/release-retention.mjs', 'scripts/cleanup-desktop-releases.mjs', 'tests/release-retention-test.mjs', '.github/workflows/desktop-cleanup.yml']
  push:
    branches: [main]
    paths: ['scripts/release-storage.mjs', 'release/download-config.json', 'scripts/release-retention.mjs', 'scripts/cleanup-desktop-releases.mjs', 'tests/release-retention-test.mjs', '.github/workflows/desktop-cleanup.yml']
permissions:
  contents: read
concurrency:
  group: desktop-tester-release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/release-retention-test.mjs
  cleanup:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.GCP_RELEASE_SERVICE_ACCOUNT != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: callayers
      - name: Remove retired installers after their grace period
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            node scripts/cleanup-desktop-releases.mjs --dry-run
          else
            node scripts/cleanup-desktop-releases.mjs
          fi
