# Copy to env.local.yaml (ignored by Git). Public config only; secrets use Secret Manager.
GOOGLE_CLOUD_PROJECT: "YOUR_PROJECT_ID"
PUBLIC_ORIGIN: "https://YOUR_PROJECT_ID.web.app"
TRIAL_DAYS: "7"
TRIAL_USD: "1"
PAID_MONTHLY_USD: "10"
GLOBAL_MONTHLY_USD: "25"
AI_MODEL: "gpt-6-luna"
AI_ENABLED: "false"
MAX_INPUT_BYTES: "120000"
MAX_OUTPUT_TOKENS: "12000"
POSTHOG_HOST: "https://us.i.posthog.com"
# Before AI_ENABLED=true, add the three currently verified USD / million token rates
# and a dated PRICE_VERSION label. Missing rates deliberately disable generation.
# INPUT_USD_PER_MILLION: "..."
# CACHED_USD_PER_MILLION: "..."
# OUTPUT_USD_PER_MILLION: "..."
# PRICE_VERSION: "model-standard-YYYY-MM-DD"
