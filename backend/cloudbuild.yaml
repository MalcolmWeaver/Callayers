# Persist intermediate stages too, so both npm installs survive remote builds.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['buildx', 'create', '--name', 'callayers', '--driver', 'docker-container', '--use']
  - name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --builder=callayers
      - --platform=linux/amd64
      - --pull
      - --cache-from=type=registry,ref=us-central1-docker.pkg.dev/$PROJECT_ID/callayers/api:buildcache
      - --cache-to=type=registry,ref=us-central1-docker.pkg.dev/$PROJECT_ID/callayers/api:buildcache,mode=max
      - --tag=$_IMAGE
      - --push
      - .
