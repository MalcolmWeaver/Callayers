<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Callayers</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/auth.css"><script type="module" src="/account.js"></script></head>
<body class="auth-page" data-page="signin">
  <main class="auth-layout"><section class="auth-card" aria-labelledby="page-title">
    <div class="auth-brand"><svg class="auth-logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="20" fill="#5E78F5"/><path d="M60 82c3.3 0 6-2.7 6-6v-3c0-2-1.3-3-3-3H30c-2 0-3-1.3-3-3V46c0-2 1.3-3 3-3h10V31H24c-5 0-9 4-9 9v33c0 5 4 9 9 9Z" fill="#fff"/><path d="M77 65c3.3 0 6-2.7 6-6v-3c0-2-1.3-3-3-3H47c-2 0-3-1.3-3-3V29c0-2 1.3-3 3-3h33c2 0 3-1.3 3-3v-3c0-3.3-2.7-6-6-6H41c-5 0-9 4-9 9v33c0 5 4 9 9 9Z" fill="#fff"/></svg><span>CALLAYERS</span></div>
    <h1 class="auth-heading" id="page-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your Callayers web account.</p>
    <button id="google-signin" class="social-button" type="button"><span class="google-mark" aria-hidden="true">G</span> Continue with Google</button>
    <div class="auth-divider">OR SIGN IN WITH EMAIL</div>
    <form id="auth-form" method="post" action="/signin" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-invalid="false" aria-describedby="email-error" required><p class="field-error" id="email-error"></p></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" aria-invalid="false" aria-describedby="password-error" required><p class="field-error" id="password-error"></p></div>
      <p id="status" class="form-error" role="alert" aria-live="polite"></p><button class="primary-button" type="submit">Sign in</button>
    </form>
    <p class="auth-footer">New to Callayers? <a href="/signup">Create an account</a></p>
    <p class="auth-footnote">Connecting the Windows app? Start there and choose Google sign-in.</p>
  </section></main>
</body></html>
