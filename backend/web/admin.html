<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Callayers administration</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main class="wide"><p class="brand">CALLAYERS</p><h1>Administration</h1>
<button id="signin">Sign in with Google</button><button id="signout" hidden>Sign out</button><p id="status" role="status" aria-live="polite"></p>
<section id="admin" hidden>
<h2>AI spending</h2><p id="spending"></p><button id="pause">Pause all AI</button><button id="resume">Resume AI</button>
<h2>Accounts</h2><form id="search"><label>Exact email <input id="email" type="email" placeholder="Search by email"></label><button>Search</button><button type="button" id="all">Recent accounts</button><button type="button" id="top">Top lifetime spenders</button></form>
<div id="accounts"></div><button id="more" hidden>Next page</button>
<section id="detail" hidden><h2 id="account-heading"></h2><p id="account-summary"></p><form id="access"><label><input id="approved" type="checkbox"> Approved for beta</label><label><input id="paid" type="checkbox"> Manually paid access</label><label><input id="disabled" type="checkbox"> Disable AI and desktop service access</label><button>Save access</button></form>
<h3>Recent AI requests</h3><p>Costs include conservative charges for uncertain provider outcomes. Pending reservations continue counting against limits until reconciled; they do not disappear on a timeout.</p><div id="requests"></div></section>
</section></main></body></html>
