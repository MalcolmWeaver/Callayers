<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<style>
/*CALLAYERS_TEXT_STYLE*/
html,body { margin:0; padding:0; overflow:hidden; background:#151519; }
#surface { transform-origin:top left; }
#text { display:block; resize:none; outline:0; min-width:0; min-height:0; overflow:hidden; background:#151519; }
</style></head><body><div id="surface"><textarea id="text" class="annotation-text" maxlength="2000" spellcheck="false" aria-label="Annotation text"></textarea></div>
<script>
'use strict';
const text=document.getElementById('text');
const surface=document.getElementById('surface');
let format;
function report() {
  if(!format)return;
  text.style.height='1px';
  const height=Math.max(format.font*1.2,text.scrollHeight);
  text.style.height=height+'px';
  window.chrome.webview.postMessage({type:'draft',text:text.value,height});
}
window.beginTextEdit = options => {
  format=options;
  surface.style.width=options.width+'px';
  surface.style.transform=`scale(${options.scale})`;
  text.style.width=options.width+'px';
  text.style.fontSize=options.font+'px';
  text.style.color=options.color;
  text.style.caretColor=options.color;
  text.value=options.text;
  report();
  text.focus();
  text.setSelectionRange(text.value.length,text.value.length);
};
text.addEventListener('input',report);
text.addEventListener('keydown',event=>{
  if(event.isComposing)return;
  if(event.key==='Escape' || event.key==='Tab' || (event.key==='Enter' && event.ctrlKey)) {
    event.preventDefault();report();
    window.chrome.webview.postMessage({type:'finish',commit:event.key!=='Escape'});
  }
});
</script></body></html>
