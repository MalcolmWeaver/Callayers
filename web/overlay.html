<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; frame-src about:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:transparent}
iframe{position:absolute;border:0;background:transparent;pointer-events:none}
svg{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none;z-index:10}
</style></head><body><div id="cards"></div><svg id="ink" viewBox="0 0 1280 720"></svg>
<script>
'use strict';
const policies = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">`;
const base = `<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,sans-serif;color:white;box-sizing:border-box}*{box-sizing:border-box}.box{height:100%;padding:18px 24px;border-radius:18px;background:rgba(19,25,40,.91);border:2px solid rgba(255,255,255,.25)}h1,p{margin:0}h1{font-size:32px}p{font-size:22px;color:#cbd5e1}</style>`;
const documents = [
  `<div class="box"><h1>Callayers</h1><p>Your ideas, in the picture.</p></div>`,
  `<style>@keyframes travel{from{transform:translateX(0)}to{transform:translateX(210px)}}.dot{height:24px;width:24px;border-radius:50%;background:#6ee7b7;animation:travel 2s ease-in-out infinite alternate}.track{margin-top:18px}</style><div class="box"><h1>Live ideas</h1><div class="track"><div class="dot"></div></div></div>`,
  `<div class="box"><p>Time remaining</p><h1 id="time" style="font-size:48px;font-variant-numeric:tabular-nums">05:00</h1></div><script>const start=performance.now();setInterval(()=>{const left=Math.max(0,300-Math.floor((performance.now()-start)/1000));document.getElementById('time').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')},100);<\/script>`
];
const frames = new Map();
window.stopScene = () => { document.getElementById('cards').replaceChildren(); frames.clear(); document.getElementById('ink').replaceChildren(); };
window.setScene = scene => {
  if (!scene || !Array.isArray(scene.cards) || !Array.isArray(scene.strokes)) return;
  const visible = new Set();
  for (const c of scene.cards) {
    if (!Number.isInteger(c.id) || c.id<0 || c.id>=documents.length || !c.visible) continue;
    visible.add(c.id);
    let iframe=frames.get(c.id);
    if (!iframe) {
      iframe=document.createElement('iframe');
      iframe.setAttribute('sandbox','allow-scripts');
      iframe.setAttribute('allow',"camera 'none'; microphone 'none'; geolocation 'none'; clipboard-read 'none'; clipboard-write 'none'; fullscreen 'none'; autoplay 'none'");
      iframe.referrerPolicy='no-referrer';
      iframe.srcdoc='<!doctype html><html><head><meta charset="utf-8">'+policies+base+'</head><body>'+documents[c.id]+'</body></html>';
      frames.set(c.id,iframe);document.getElementById('cards').append(iframe);
    }
    for(const [name,value] of Object.entries({left:c.x,top:c.y,width:c.w,height:c.h})) if(Number.isFinite(value)) iframe.style[name]=value+'px';
    iframe.style.zIndex=String(c.id);
  }
  for (const [id,frame] of frames) if(!visible.has(id)){frame.remove();frames.delete(id)}
  const ink=document.getElementById('ink');ink.replaceChildren();
  for(const stroke of scene.strokes){
    if(!Array.isArray(stroke)||!stroke.length)continue;
    const points=stroke.filter(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)).map(p=>p.join(',')).join(' ');
    const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    line.setAttribute('points',points);line.setAttribute('fill','none');line.setAttribute('stroke','#ffd166');line.setAttribute('stroke-width','6');line.setAttribute('stroke-linecap','round');line.setAttribute('stroke-linejoin','round');ink.append(line);
  }
};
</script></body></html>
